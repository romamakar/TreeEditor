# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build Api
      run: dotnet build TreeEditor.Api\TreeEditor.Api.csproj --no-restore
    - name: Build Wev
      run: dotnet build TreeEditor.Web\TreeEditor.Web.csproj --no-restore
    - name: Test
      run: dotnet test Tests\TreeEditor.Api.Tests\TreeEditor.Api.Tests.csproj --no-build --verbosity normal
